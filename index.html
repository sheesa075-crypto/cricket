<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Cricket Scores</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        #cricket-scores {
            background-color: #2d2d2d;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        
        #match-title {
            color: #4CAF50;
            font-size: 24px;
            margin-bottom: 15px;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }
        
        #team1 {
            font-size: 20px;
            font-weight: bold;
            margin: 10px 0;
            color: #64B5F6;
        }
        
        #status {
            font-size: 16px;
            margin: 10px 0;
            color: #FFB74D;
        }
        
        #score {
            margin-top: 15px;
            padding: 15px;
            background-color: #3d3d3d;
            border-radius: 5px;
            line-height: 1.8;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div id="cricket-scores">
        <h2 id="match-title">Loading cricket scores...</h2>
        <p id="team1"></p>
        <p id="status"></p>
        <div id="score"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
