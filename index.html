<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏏 Live Cricket Scores</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            animation: fadeInDown 0.8s ease;
        }

        .header h1 {
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .api-status {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 10px;
            font-size: 0.9em;
        }

        .api-status.connected {
            background: rgba(76, 175, 80, 0.3);
        }

        .api-status.error {
            background: rgba(244, 67, 54, 0.3);
        }

        .api-status.loading {
            background: rgba(255, 193, 7, 0.3);
        }

        .last-updated {
            display: block;
            font-size: 0.85em;
            margin-top: 5px;
            opacity: 0.8;
        }

        .toggle-mode {
            text-align: center;
            margin-bottom: 20px;
        }

        .toggle-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            margin: 0 5px;
            transition: all 0.3s ease;
            position: relative;
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ff4444;
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75em;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .match-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.8s ease;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .match-card.live-match {
            border: 3px solid #ff4444;
            box-shadow: 0 10px 40px rgba(255, 68, 68, 0.5);
        }

        .match-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
        }

        .match-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }

        .match-header.live-header {
            background: linear-gradient(135deg, #ff4444 0%, #ff6b6b 100%);
        }

        .match-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .match-type {
            font-size: 0.9em;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .teams-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .team {
            text-align: center;
            flex: 1;
        }

        .team-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .team-score {
            font-size: 1.5em;
            color: #667eea;
            font-weight: bold;
        }

        .team-score.live-score {
            color: #ff4444;
            animation: scoreUpdate 0.5s ease;
        }

        .vs-divider {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
            margin: 0 15px;
        }

        .status-section {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 1em;
            font-weight: bold;
            margin: 15px 0;
        }

        .status-section.live {
            animation: pulse 2s infinite;
            background: linear-gradient(135deg, #ff4444 0%, #ff6b6b 100%);
        }

        .status-section.upcoming {
            background: linear-gradient(135deg, #4CAF50 0%, #81C784 100%);
        }

        .live-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #ffffff;
            border-radius: 50%;
            animation: blink 1.5s infinite;
            margin-right: 8px;
        }

        .match-details {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 0.9em;
        }

        .match-details.live-details {
            background: #ffebee;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #c8e6c9;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-weight: bold;
            color: #2e7d32;
        }

        .detail-value {
            color: #333;
        }

        .countdown-timer {
            background: rgba(76, 175, 80, 0.2);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            color: #2e7d32;
            margin-top: 10px;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: white;
            font-size: 1.5em;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        .error-message {
            background: rgba(244, 67, 54, 0.9);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            margin: 20px 0;
            animation: fadeInUp 0.5s ease;
        }

        .error-message h3 {
            font-size: 1.5em;
            margin-bottom: 15px;
        }

        .error-message p {
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .error-details {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-family: monospace;
            font-size: 0.9em;
            text-align: left;
        }

        .refresh-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .auto-refresh-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(76, 175, 80, 0.9);
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 0.9em;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            animation: slideInRight 0.5s ease;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.02);
            }
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.2;
            }
        }

        @keyframes dots {
            0%, 20% {
                content: '.';
            }
            40% {
                content: '..';
            }
            60%, 100% {
                content: '...';
            }
        }

        @keyframes scoreUpdate {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
                color: #ff6b6b;
            }
            100% {
                transform: scale(1);
            }
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .matches-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2em;
            }

            .teams-section {
                flex-direction: column;
                gap: 15px;
            }

            .vs-divider {
                transform: rotate(90deg);
            }

            .auto-refresh-indicator {
                bottom: 10px;
                right: 10px;
                font-size: 0.8em;
                padding: 8px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏏 Live Cricket Scores</h1>
            <p>Real-time updates from Cricbuzz API</p>
            <div class="api-status loading" id="apiStatus">
                ⏳ Connecting to API...
                <span class="last-updated" id="lastUpdated"></span>
            </div>
        </div>

        <div class="toggle-mode">
            <button class="toggle-btn active" id="liveBtn" onclick="showLive()">
                🔴 Live Matches
                <span class="badge" id="liveBadge" style="display: none;">0</span>
            </button>
            <button class="toggle-btn" id="recentBtn" onclick="showRecent()">
                📋 Recent
                <span class="badge" id="recentBadge" style="display: none;">0</span>
            </button>
            <button class="toggle-btn" id="upcomingBtn" onclick="showUpcoming()">
                📅 Upcoming
                <span class="badge" id="upcomingBadge" style="display: none;">0</span>
            </button>
        </div>

        <div id="matchesContainer">
            <div class="loading">Fetching cricket matches from API</div>
        </div>

        <div id="autoRefreshIndicator" class="auto-refresh-indicator" style="display: none;">
            🔄 Auto-refreshing... <span id="refreshCountdown">30</span>s
        </div>
    </div>

    <script>
        // ⚠️ YOUR API KEY HERE - Apni RapidAPI key yahan paste karo
        const RAPIDAPI_KEY = 'aa9f77a5f8msh6f99a54f9fe3879p1a614ejsn59da5ed6465f';
        const RAPIDAPI_HOST = 'cricbuzz-cricket.p.rapidapi.com';

        // Debug logging
        console.log('🔑 API Configuration:');
        console.log('Key Length:', RAPIDAPI_KEY.length);
        console.log('Key Preview:', RAPIDAPI_KEY.substring(0, 15) + '***');
        console.log('Host:', RAPIDAPI_HOST);

        // Configuration
        const REFRESH_INTERVAL = 30000; // 30 seconds
        const UPCOMING_REFRESH_INTERVAL = 300000; // 5 minutes

        // State management
        let currentMode = 'live';
        let allMatches = { live: [], recent: [], upcoming: [] };
        let refreshTimer = null;
        let countdownTimer = null;
        let lastRefreshTime = null;

        // Fetch matches from Real API
        async function fetchRealMatches() {
            console.log('🔄 Fetching matches from API...');
            
            try {
                const apiUrl = `https://${RAPIDAPI_HOST}/matches/v1/recent`;
                console.log('📡 Calling API:', apiUrl);
                
                const response = await fetch(apiUrl, {
                    method: 'GET',
                    headers: {
                        'X-RapidAPI-Key': RAPIDAPI_KEY,
                        'X-RapidAPI-Host': RAPIDAPI_HOST
                    }
                });

                console.log(`📊 Response Status: ${response.status} ${response.statusText}`);

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('❌ API Error Response:', errorText);
                    throw new Error(`API returned ${response.status}: ${errorText}`);
                }

                const data = await response.json();
                console.log('✅ Data received successfully!');
                console.log('📦 API Response:', data);
                
                lastRefreshTime = new Date();
                updateLastRefreshTime();
                updateApiStatus('connected', '✓ API Connected');
                
                return parseApiData(data);
                
            } catch (error) {
                console.error('❌ Fetch Error:', error);
                updateApiStatus('error', `⚠ API Error: ${error.message}`);
                showErrorMessage(error.message);
                return { live: [], recent: [], upcoming: [] };
            }
        }

        // Parse API data
        function parseApiData(apiData) {
            console.log('🔍 Parsing API data...');
            
            const matches = {
                live: [],
                recent: [],
                upcoming: []
            };

            try {
                if (!apiData.typeMatches || apiData.typeMatches.length === 0) {
                    console.log('⚠️ No typeMatches found');
                    return matches;
                }

                console.log(`📋 Found ${apiData.typeMatches.length} type matches`);

                apiData.typeMatches.forEach((typeMatch) => {
                    if (typeMatch.seriesMatches) {
                        typeMatch.seriesMatches.forEach(seriesMatch => {
                            if (seriesMatch.seriesAdWrapper) {
                                const series = seriesMatch.seriesAdWrapper;
                                
                                if (series.matches) {
                                    series.matches.forEach(match => {
                                        const matchInfo = match.matchInfo;
                                        if (matchInfo) {
                                            const parsedMatch = {
                                                id: matchInfo.matchId,
                                                name: `${matchInfo.team1?.teamName || 'TBA'} vs ${matchInfo.team2?.teamName || 'TBA'}`,
                                                series: matchInfo.seriesName || 'Unknown Series',
                                                matchType: matchInfo.matchFormat || 'Unknown',
                                                team1: matchInfo.team1?.teamName || 'TBA',
                                                team2: matchInfo.team2?.teamName || 'TBA',
                                                team1Score: matchInfo.team1Score || '-',
                                                team2Score: matchInfo.team2Score || '-',
                                                status: matchInfo.status || 'Scheduled',
                                                venue: matchInfo.venueInfo?.ground || 'Venue TBA',
                                                city: matchInfo.venueInfo?.city || '',
                                                matchState: matchInfo.state,
                                                startDate: matchInfo.startDate,
                                                isLive: matchInfo.state === 'In Progress'
                                            };

                                            if (parsedMatch.isLive) {
                                                matches.live.push(parsedMatch);
                                            } else if (matchInfo.state === 'Complete') {
                                                matches.recent.push(parsedMatch);
                                            } else if (matchInfo.state === 'Upcoming' || matchInfo.state === 'Preview') {
                                                matches.upcoming.push(parsedMatch);
                                            }
                                        }
                                    });
                                }
                            }
                        });
                    }
                });

                console.log(`✅ Parsed: ${matches.live.length} live, ${matches.recent.length} recent, ${matches.upcoming.length} upcoming`);
                updateMatchBadges(matches);

            } catch (parseError) {
                console.error('❌ Parse Error:', parseError);
            }

            return matches;
        }

        // Update badges
        function updateMatchBadges(matches) {
            const liveBadge = document.getElementById('liveBadge');
            const recentBadge = document.getElementById('recentBadge');
            const upcomingBadge = document.getElementById('upcomingBadge');

            if (matches.live.length > 0) {
                liveBadge.textContent = matches.live.length;
                liveBadge.style.display = 'flex';
            } else {
                liveBadge.style.display = 'none';
            }

            if (matches.recent.length > 0) {
                recentBadge.textContent = matches.recent.length;
                recentBadge.style.display = 'flex';
            } else {
                recentBadge.style.display = 'none';
            }

            if (matches.upcoming.length > 0) {
                upcomingBadge.textContent = matches.upcoming.length;
                upcomingBadge.style.display = 'flex';
            } else {
                upcomingBadge.style.display = 'none';
            }
        }

        // Update status
        function updateApiStatus(status, message) {
            const statusEl = document.getElementById('apiStatus');
            statusEl.className = `api-status ${status}`;
            const textNode = Array.from(statusEl.childNodes).find(node => node.nodeType === Node.TEXT_NODE);
            if (textNode) {
                textNode.textContent = message + ' ';
            } else {
                statusEl.insertBefore(document.createTextNode(message + ' '), statusEl.firstChild);
            }
        }

        // Update time
        function updateLastRefreshTime() {
            if (lastRefreshTime) {
                const lastUpdatedEl = document.getElementById('lastUpdated');
                lastUpdatedEl.textContent = `Last updated: ${lastRefreshTime.toLocaleTimeString()}`;
            }
        }

        // Show error
        function showErrorMessage(errorMsg) {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = `
                <div class="error-message">
                    <h3>⚠️ API Connection Failed</h3>
                    <p>${errorMsg}</p>
                    <div class="error-details">
                        <strong>Troubleshooting:</strong><br><br>
                        1. Verify your RapidAPI key is correct<br>
                        2. Check RapidAPI subscription is active<br>
                        3. Open console (F12) for detailed errors<br>
                        4. Ensure "Cricbuzz Cricket" API is subscribed<br>
                        5. Check API rate limits
                    </div>
                    <button class="refresh-btn" onclick="loadMatches()">🔄 Retry</button>
                </div>
            `;
        }

        // Format time
        function formatMatchTime(startDate) {
            if (!startDate) return 'Time TBA';
            
            const matchDate = new Date(parseInt(startDate));
            const now = new Date();
            const diffMs = matchDate - now;
            const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
            const diffDays = Math.floor(diffHours / 24);

            if (diffMs < 0) {
                return 'Match should have started';
            } else if (diffHours < 1) {
                const diffMins = Math.floor(diffMs / (1000 * 60));
                return `Starts in ${diffMins} minutes`;
            } else if (diffHours < 24) {
                return `Starts in ${diffHours} hours`;
            } else if (diffDays === 1) {
                return `Tomorrow at ${matchDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
            } else {
                return `${matchDate.toLocaleDateString()} at ${matchDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
            }
        }

        // Display matches
        function displayMatches(matches) {
            const container = document.getElementById('matchesContainer');
            
            if (!matches || matches.length === 0) {
                container.innerHTML = `
                    <div class="error-message">
                        <h3>📭 No ${currentMode} matches</h3>
                        <p>No ${currentMode} matches available right now.</p>
                        <button class="refresh-btn" onclick="loadMatches()">🔄 Refresh</button>
                    </div>
                `;
                return;
            }

            const matchesHTML = matches.map(match => {
                const isLive = match.isLive;
                const liveClass = isLive ? 'live-match' : '';
                const headerClass = isLive ? 'live-header' : '';
                const detailsClass = isLive ? 'live-details' : '';
                const liveIndicator = isLive ? '<span class="live-indicator"></span>' : '';
                const statusClass = isLive ? 'live' : (currentMode === 'upcoming' ? 'upcoming' : '');
                const scoreClass = isLive ? 'live-score' : '';
                const timingInfo = currentMode === 'upcoming' ? 
                    `<div class="countdown-timer">⏰ ${formatMatchTime(match.startDate)}</div>` : '';
                
                return `
                    <div class="match-card ${liveClass}">
                        <div class="match-header ${headerClass}">
                            <div class="match-title">${match.name}</div>
                            <div class="match-type">${match.series} • ${match.matchType}</div>
                        </div>
                        <div class="teams-section">
                            <div class="team">
                                <div class="team-name">${match.team1}</div>
                                <div class="team-score ${scoreClass}">${match.team1Score}</div>
                            </div>
                            <div class="vs-divider">VS</div>
                            <div class="team">
                                <div class="team-name">${match.team2}</div>
                                <div class="team-score ${scoreClass}">${match.team2Score}</div>
                            </div>
                        </div>
                        <div class="status-section ${statusClass}">
                            ${liveIndicator}${match.status}
                        </div>
                        ${timingInfo}
                        <div class="match-details ${detailsClass}">
                            <div class="detail-row">
                                <span class="detail-label">Venue:</span>
                                <span class="detail-value">${match.venue}${match.city ? ', ' + match.city : ''}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Status:</span>
                                <span class="detail-value">${match.matchState}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Match ID:</span>
                                <span class="detail-value">#${match.id}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = `<div class="matches-grid">${matchesHTML}</div>`;
        }

        // Mode switching
        function showLive() {
            currentMode = 'live';
            updateActiveButton('liveBtn');
            displayMatches(allMatches.live);
            setupAutoRefresh();
        }

        function showRecent() {
            currentMode = 'recent';
            updateActiveButton('recentBtn');
            displayMatches(allMatches.recent);
            stopAutoRefresh();
        }

        function showUpcoming() {
            currentMode = 'upcoming';
            updateActiveButton('upcomingBtn');
            displayMatches(allMatches.upcoming);
            setupAutoRefresh(true);
        }

        function updateActiveButton(activeId) {
            document.querySelectorAll('.toggle-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(activeId).classList.add('active');
        }

        // Auto-refresh
        function setupAutoRefresh(isUpcoming = false) {
            stopAutoRefresh();
            
            const interval = isUpcoming ? UPCOMING_REFRESH_INTERVAL : REFRESH_INTERVAL;
            let countdown = interval / 1000;

            const indicator = document.getElementById('autoRefreshIndicator');
            indicator.style.display = 'block';

            countdownTimer = setInterval(() => {
                countdown--;
                document.getElementById('refreshCountdown').textContent = countdown;
                if (countdown <= 0) countdown = interval / 1000;
            }, 1000);

            refreshTimer = setInterval(async () => {
                console.log(`🔄 Auto-refreshing ${currentMode}...`);
                indicator.textContent = `🔄 Refreshing...`;
                
                allMatches = await fetchRealMatches();
                displayMatches(allMatches[currentMode]);
                
                countdown = interval / 1000;
                indicator.innerHTML = `🔄 Auto-refreshing... <span id="refreshCountdown">${countdown}</span>s`;
                
                if (isUpcoming && allMatches.live.length > 0) {
                    console.log('🔴 Match is now LIVE!');
                    showLive();
                }
            }, interval);
        }

        function stopAutoRefresh() {
            if (refreshTimer) clearInterval(refreshTimer);
            if (countdownTimer) clearInterval(countdownTimer);
            document.getElementById('autoRefreshIndicator').style.display = 'none';
        }

        // Load matches
        async function loadMatches() {
            console.log('🚀 Loading matches...');
            const container = document.getElementById('matchesContainer');
            container.innerHTML = '<div class="loading">Fetching cricket matches from API</div>';
            
            updateApiStatus('loading', '⏳ Loading...');
            
            allMatches = await fetchRealMatches();
            displayMatches(allMatches[currentMode]);
            
            if (currentMode === 'live') {
                setupAutoRefresh();
            } else if (currentMode === 'upcoming') {
                setupAutoRefresh(true);
            }
        }

        // Initialize
        window.addEventListener('load', function() {
