<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏏 Live Cricket Scores</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            animation: fadeInDown 0.8s ease;
        }

        .header h1 {
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .api-status {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 10px;
            font-size: 0.9em;
        }

        .api-status.connected {
            background: rgba(76, 175, 80, 0.3);
        }

        .api-status.error {
            background: rgba(244, 67, 54, 0.3);
        }

        .toggle-mode {
            text-align: center;
            margin-bottom: 20px;
        }

        .toggle-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            margin: 0 5px;
            transition: all 0.3s ease;
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .match-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.8s ease;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .match-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
        }

        .match-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }

        .match-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .match-type {
            font-size: 0.9em;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .teams-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .team {
            text-align: center;
            flex: 1;
        }

        .team-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .team-score {
            font-size: 1.5em;
            color: #667eea;
            font-weight: bold;
        }

        .vs-divider {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
            margin: 0 15px;
        }

        .status-section {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 1em;
            font-weight: bold;
            margin: 15px 0;
        }

        .status-section.live {
            animation: pulse 2s infinite;
        }

        .live-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #ff4444;
            border-radius: 50%;
            animation: blink 1.5s infinite;
            margin-right: 8px;
        }

        .match-details {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 0.9em;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #c8e6c9;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-weight: bold;
            color: #2e7d32;
        }

        .detail-value {
            color: #333;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: white;
            font-size: 1.5em;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        .error-message {
            background: rgba(244, 67, 54, 0.9);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin: 20px 0;
        }

        .refresh-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.02);
            }
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        @keyframes dots {
            0%, 20% {
                content: '.';
            }
            40% {
                content: '..';
            }
            60%, 100% {
                content: '...';
            }
        }

        @media (max-width: 768px) {
            .matches-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2em;
            }

            .teams-section {
                flex-direction: column;
                gap: 15px;
            }

            .vs-divider {
                transform: rotate(90deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏏 Live Cricket Scores</h1>
            <p>Real-time updates from around the world</p>
            <div class="api-status" id="apiStatus">Connecting to API...</div>
        </div>

        <div class="toggle-mode">
            <button class="toggle-btn active" id="liveBtn" onclick="showLive()">🔴 Live Matches</button>
            <button class="toggle-btn" id="recentBtn" onclick="showRecent()">📋 Recent</button>
            <button class="toggle-btn" id="upcomingBtn" onclick="showUpcoming()">📅 Upcoming</button>
        </div>

        <div id="matchesContainer">
            <div class="loading">Loading cricket matches</div>
        </div>
    </div>

    <script>
        // ⚠️ IMPORTANT: Replace with your actual RapidAPI key
        const RAPIDAPI_KEY = 'aa9f77a5f8msh6f99a54f9fe3879p1a614ejsn59da5ed6465f';
        const RAPIDAPI_HOST = 'rapidapi.com';

        // Mode toggle
        let currentMode = 'live';
        let allMatches = [];
        let isUsingDummyData = true;

        // Dummy data for testing (jab tak API key nahi milta)
        const dummyMatches = {
            live: [
                {
                    id: 1,
                    name: "India vs Australia - 3rd Test",
                    matchType: "Test",
                    team1: "India",
                    team2: "Australia",
                    team1Score: "296/10 & 187/2",
                    team2Score: "224/10 & 256/10",
                    status: "India need 7 more runs",
                    venue: "Melbourne Cricket Ground",
                    isLive: true
                },
                {
                    id: 2,
                    name: "Pakistan vs England - 2nd ODI",
                    matchType: "ODI",
                    team1: "Pakistan",
                    team2: "England",
                    team1Score: "285/7",
                    team2Score: "156/4 (32 ov)",
                    status: "England need 130 runs from 18 overs",
                    venue: "National Stadium, Karachi",
                    isLive: true
                }
            ],
            recent: [
                {
                    id: 3,
                    name: "Sri Lanka vs Bangladesh - ODI",
                    matchType: "ODI",
                    team1: "Sri Lanka",
                    team2: "Bangladesh",
                    team1Score: "312/6",
                    team2Score: "267/10",
                    status: "Sri Lanka won by 45 runs",
                    venue: "R. Premadasa Stadium",
                    isLive: false
                },
                {
                    id: 4,
                    name: "South Africa vs New Zealand - T20",
                    matchType: "T20",
                    team1: "South Africa",
                    team2: "New Zealand",
                    team1Score: "189/4",
                    team2Score: "167/8",
                    status: "South Africa won by 22 runs",
                    venue: "Newlands, Cape Town",
                    isLive: false
                }
            ],
            upcoming: [
                {
                    id: 5,
                    name: "West Indies vs Ireland - T20",
                    matchType: "T20",
                    team1: "West Indies",
                    team2: "Ireland",
                    team1Score: "",
                    team2Score: "",
                    status: "Match starts in 2 hours",
                    venue: "Sabina Park, Jamaica",
                    isLive: false
                },
                {
                    id: 6,
                    name: "Afghanistan vs Zimbabwe - ODI",
                    matchType: "ODI",
                    team1: "Afghanistan",
                    team2: "Zimbabwe",
                    team1Score: "",
                    team2Score: "",
                    status: "Tomorrow at 2:30 PM",
                    venue: "Sharjah Cricket Stadium",
                    isLive: false
                }
            ]
        };

        // Fetch matches from Real API
        async function fetchRealMatches() {
            try {
                const response = await fetch(`https://${RAPIDAPI_HOST}/matches/v1/recent`, {
                    method: 'GET',
                    headers: {
                        'X-RapidAPI-Key': RAPIDAPI_KEY,
                        'X-RapidAPI-Host': RAPIDAPI_HOST
                    }
                });

                if (!response.ok) {
                    throw new Error('API request failed');
                }

                const data = await response.json();
                console.log('API Response:', data);
                
                updateApiStatus('connected');
                isUsingDummyData = false;
                
                return parseApiData(data);
                
            } catch (error) {
                console.error('API Error:', error);
                updateApiStatus('error');
                isUsingDummyData = true;
                return dummyMatches;
            }
        }

        // Parse API data into our format
        function parseApiData(apiData) {
            const matches = {
                live: [],
                recent: [],
                upcoming: []
            };

            try {
                if (apiData.typeMatches) {
                    apiData.typeMatches.forEach(typeMatch => {
                        if (typeMatch.seriesMatches) {
                            typeMatch.seriesMatches.forEach(seriesMatch => {
                                if (seriesMatch.seriesAdWrapper) {
                                    const series = seriesMatch.seriesAdWrapper;
                                    
                                    if (series.matches) {
                                        series.matches.forEach(match => {
                                            const matchInfo = match.matchInfo;
                                            if (matchInfo) {
                                                const parsedMatch = {
                                                    id: matchInfo.matchId,
                                                    name: `${matchInfo.team1?.teamName || 'TBA'} vs ${matchInfo.team2?.teamName || 'TBA'}`,
                                                    matchType: matchInfo.matchFormat || 'Unknown',
                                                    team1: matchInfo.team1?.teamName || 'TBA',
                                                    team2: matchInfo.team2?.teamName || 'TBA',
                                                    team1Score: matchInfo.team1Score || '',
                                                    team2Score: matchInfo.team2Score || '',
                                                    status: matchInfo.status || 'Scheduled',
                                                    venue: matchInfo.venueInfo?.ground || 'Venue TBA',
                                                    isLive: matchInfo.state === 'In Progress'
                                                };

                                                // Categorize matches
                                                if (parsedMatch.isLive) {
                                                    matches.live.push(parsedMatch);
                                                } else if (matchInfo.state === 'Complete') {
                                                    matches.recent.push(parsedMatch);
                                                } else {
                                                    matches.upcoming.push(parsedMatch);
                                                }
                                            }
                                        });
                                    }
                                }
                            });
                        }
                    });
                }
            } catch (parseError) {
                console.error('Parse Error:', parseError);
            }

            return matches;
        }

        // Update API status indicator
        function updateApiStatus(status) {
            const statusEl = document.getElementById('apiStatus');
            if (status === 'connected') {
                statusEl.textContent = '✓ Connected to Live API';
                statusEl.className = 'api-status connected';
            } else if (status === 'error') {
                statusEl.textContent = '⚠ Using Demo Data (Add API Key for Real Data)';
                statusEl.className = 'api-status error';
            } else {
                statusEl.textContent = 'Connecting...';
                statusEl.className = 'api-status';
            }
        }

        // Display matches
        function displayMatches(matches) {
            const container = document.getElementById('matchesContainer');
            
            if (!matches || matches.length === 0) {
                container.innerHTML = `
                    <div class="error-message">
                        <h3>📭 No ${currentMode} matches found</h3>
                        <p>Check back later for updates</p>
                        <button class="refresh-btn" onclick="loadMatches()">🔄 Refresh</button>
                    </div>
                `;
                return;
            }

            const matchesHTML = matches.map(match => {
                const liveClass = match.isLive ? 'live' : '';
                const liveIndicator = match.isLive ? '<span class="live-indicator"></span>' : '';
                
                return `
                    <div class="match-card">
                        <div class="match-header">
                            <div class="match-title">${match.name}</div>
                            <div class="match-type">${match.matchType}</div>
                        </div>
                        
                        <div class="teams-section">
                            <div class="team">
                                <div class="team-name">${match.team1}</div>
                                <div class="team-score">${match.team1Score}</div>
                            </div>
                            <div class="vs-divider">VS</div>
                            <div class="team">
                                <div class="team-name">${match.team2}</div>
                                <div class="team-score">${match.team2Score}</div>
                            </div>
                        </div>
                        
                        <div class="status-section ${liveClass}">
                            ${liveIndicator}${match.status}
                        </div>
                        
                        <div class="match-details">
                            <div class="detail-row">
                                <span class="detail-label">Venue:</span>
                                <span class="detail-value">${match.venue}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Format:</span>
                                <span class="detail-value">${match.matchType}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = `<div class="matches-grid">${matchesHTML}</div>`;
        }

        // Mode switching functions
        function showLive() {
            currentMode = 'live';
            updateActiveButton('liveBtn');
            displayMatches(allMatches.live);
        }

        function showRecent() {
            currentMode = 'recent';
            updateActiveButton('recentBtn');
            displayMatches(allMatches.recent);
        }

        function showUpcoming() {
            currentMode = 'upcoming';
            updateActiveButton('upcomingBtn');
            displayMatches(allMatches.upcoming);
        }

        function updateActiveButton(activeId) {
            document.querySelectorAll('.toggle-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(activeId).classList.add('active');
        }

        // Load matches
        async function loadMatches() {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = '<div class="loading">Loading cricket matches</div>';
            
            // Check if API key is set
            if (RAPIDAPI_KEY === 'YOUR_RAPIDAPI_KEY_HERE') {
                console.warn('⚠️ Using dummy data. Add your RapidAPI key for real data.');
                updateApiStatus('error');
                allMatches = dummyMatches;
                displayMatches(allMatches[currentMode]);
            } else {
                allMatches = await fetchRealMatches();
                displayMatches(allMatches[currentMode]);
            }
        }

        // Initialize app
        window.addEventListener('load', function() {
            console.log('🏏 Cricket App Initialized!');
            loadMatches();
            
            // Auto-refresh every 30 seconds for live matches
            setInterval(() => {
                if (currentMode === 'live') {
                    console.log('Auto-refreshing live matches...');
                    loadMatches();
                }
            }, 30000);
        });
    </script>
</body>
</html>
