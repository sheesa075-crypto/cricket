<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Live Scoring</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Cricket Live Scoring</h1>
    </header>
    <main>
        <div id="match-info">
            <h2 id="match-title">Loading match...</h2>
            <div id="score">
                <p id="team1">Team 1: 0/0</p>
                <p id="team2">Team 2: 0/0</p>
            </div>
            <p id="status">Status: Loading...</p>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
