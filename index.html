<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏏 Live Cricket Scores</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            animation: fadeInDown 0.8s ease;
        }

        .header h1 {
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .api-status {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 10px;
            font-size: 0.9em;
        }

        .api-status.connected {
            background: rgba(76, 175, 80, 0.3);
        }

        .api-status.error {
            background: rgba(244, 67, 54, 0.3);
        }

        .api-status.loading {
            background: rgba(255, 193, 7, 0.3);
        }

        .toggle-mode {
            text-align: center;
            margin-bottom: 20px;
        }

        .toggle-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            margin: 0 5px;
            transition: all 0.3s ease;
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .match-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.8s ease;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .match-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
        }

        .match-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }

        .match-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .match-type {
            font-size: 0.9em;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .teams-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .team {
            text-align: center;
            flex: 1;
        }

        .team-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .team-score {
            font-size: 1.5em;
            color: #667eea;
            font-weight: bold;
        }

        .vs-divider {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
            margin: 0 15px;
        }

        .status-section {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 1em;
            font-weight: bold;
            margin: 15px 0;
        }

        .status-section.live {
            animation: pulse 2s infinite;
        }

        .live-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #ff4444;
            border-radius: 50%;
            animation: blink 1.5s infinite;
            margin-right: 8px;
        }

        .match-details {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 0.9em;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #c8e6c9;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-weight: bold;
            color: #2e7d32;
        }

        .detail-value {
            color: #333;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: white;
            font-size: 1.5em;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        .error-message {
            background: rgba(244, 67, 54, 0.9);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            margin: 20px 0;
            animation: fadeInUp 0.5s ease;
        }

        .error-message h3 {
            font-size: 1.5em;
            margin-bottom: 15px;
        }

        .error-message p {
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .error-details {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-family: monospace;
            font-size: 0.9em;
            text-align: left;
        }

        .refresh-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .debug-console {
            background: rgba(0, 0, 0, 0.8);
            color: #00ff00;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 0.9em;
            max-height: 300px;
            overflow-y: auto;
        }

        .debug-console .log-entry {
            margin-bottom: 5px;
            padding: 5px;
            border-left: 3px solid #00ff00;
            padding-left: 10px;
        }

        .debug-console .log-error {
            border-left-color: #ff4444;
            color: #ff4444;
        }

        .debug-console .log-success {
            border-left-color: #44ff44;
            color: #44ff44;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.02);
            }
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        @keyframes dots {
            0%, 20% {
                content: '.';
            }
            40% {
                content: '..';
            }
            60%, 100% {
                content: '...';
            }
        }

        @media (max-width: 768px) {
            .matches-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2em;
            }

            .teams-section {
                flex-direction: column;
                gap: 15px;
            }

            .vs-divider {
                transform: rotate(90deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏏 Live Cricket Scores</h1>
            <p>Real-time updates from Cricbuzz API</p>
            <div class="api-status loading" id="apiStatus">⏳ Connecting to API...</div>
        </div>

        <div class="toggle-mode">
            <button class="toggle-btn active" id="liveBtn" onclick="showLive()">🔴 Live Matches</button>
            <button class="toggle-btn" id="recentBtn" onclick="showRecent()">📋 Recent</button>
            <button class="toggle-btn" id="upcomingBtn" onclick="showUpcoming()">📅 Upcoming</button>
        </div>

        <div id="matchesContainer">
            <div class="loading">Fetching cricket matches from API</div>
        </div>

        <div id="debugConsole" class="debug-console" style="display: none;">
            <strong>Debug Console:</strong>
            <div id="debugLogs"></div>
        </div>
    </div>

    <script>
        // ⚠️ IMPORTANT: Replace with your actual RapidAPI key
        const RAPIDAPI_KEY = 'aa9f77a5f8msh6f99a54f9fe3879p1a614ejsn59da5ed6465f';
        const RAPIDAPI_HOST = 'rapidapi.com';



        // Debug logging
        const debugLogs = [];
        function debugLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = `[${timestamp}] ${message}`;
            debugLogs.push({ message: logEntry, type });
            console.log(logEntry);
            updateDebugConsole();
        }

        function updateDebugConsole() {
            const debugDiv = document.getElementById('debugLogs');
            if (debugDiv) {
                debugDiv.innerHTML = debugLogs.map(log => {
                    const className = log.type === 'error' ? 'log-error' : 
                                     log.type === 'success' ? 'log-success' : 'log-entry';
                    return `<div class="${className}">${log.message}</div>`;
                }).slice(-20).join(''); // Show last 20 logs
            }
        }

        // Mode toggle
        let currentMode = 'live';
        let allMatches = { live: [], recent: [], upcoming: [] };

        // Fetch matches from Real API
        async function fetchRealMatches() {
            debugLog('🔄 Starting API request...', 'info');
            
            try {
                // Check if API key is set
                if (RAPIDAPI_KEY === 'YOUR_RAPIDAPI_KEY_HERE') {
                    throw new Error('API key not configured. Please add your RapidAPI key in the code.');
                }

                debugLog(`📡 Calling API: https://${RAPIDAPI_HOST}/matches/v1/recent`, 'info');
                
                const response = await fetch(`https://${RAPIDAPI_HOST}/matches/v1/recent`, {
                    method: 'GET',
                    headers: {
                        'X-RapidAPI-Key': RAPIDAPI_KEY,
                        'X-RapidAPI-Host': RAPIDAPI_HOST
                    }
                });

                debugLog(`📊 Response Status: ${response.status} ${response.statusText}`, 
                         response.ok ? 'success' : 'error');

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`API returned ${response.status}: ${errorText}`);
                }

                const data = await response.json();
                debugLog('✅ Data received successfully', 'success');
                debugLog(`📦 Data structure: ${JSON.stringify(Object.keys(data))}`, 'info');
                
                console.log('Full API Response:', data);
                
                updateApiStatus('connected', '✓ API Connected Successfully');
                
                return parseApiData(data);
                
            } catch (error) {
                debugLog(`❌ API Error: ${error.message}`, 'error');
                console.error('Detailed API Error:', error);
                updateApiStatus('error', `⚠ API Error: ${error.message}`);
                
                // Show detailed error to user
                showErrorMessage(error.message);
                
                return { live: [], recent: [], upcoming: [] };
            }
        }

        // Parse API data into our format
        function parseApiData(apiData) {
            debugLog('🔍 Parsing API data...', 'info');
            
            const matches = {
                live: [],
                recent: [],
                upcoming: []
            };

            try {
                if (!apiData.typeMatches || apiData.typeMatches.length === 0) {
                    debugLog('⚠️ No typeMatches found in API response', 'error');
                    return matches;
                }

                debugLog(`📋 Found ${apiData.typeMatches.length} type matches`, 'info');

                apiData.typeMatches.forEach((typeMatch, index) => {
                    debugLog(`Processing type match ${index + 1}...`, 'info');
                    
                    if (typeMatch.seriesMatches) {
                        typeMatch.seriesMatches.forEach(seriesMatch => {
                            if (seriesMatch.seriesAdWrapper) {
                                const series = seriesMatch.seriesAdWrapper;
                                
                                if (series.matches) {
                                    series.matches.forEach(match => {
                                        const matchInfo = match.matchInfo;
                                        if (matchInfo) {
                                            const parsedMatch = {
                                                id: matchInfo.matchId,
                                                name: `${matchInfo.team1?.teamName || 'TBA'} vs ${matchInfo.team2?.teamName || 'TBA'}`,
                                                matchType: matchInfo.matchFormat || 'Unknown',
                                                team1: matchInfo.team1?.teamName || 'TBA',
                                                team2: matchInfo.team2?.teamName || 'TBA',
                                                team1Score: matchInfo.team1Score || '-',
                                                team2Score: matchInfo.team2Score || '-',
                                                status: matchInfo.status || 'Scheduled',
                                                venue: matchInfo.venueInfo?.ground || 'Venue TBA',
                                                isLive: matchInfo.state === 'In Progress'
                                            };

                                            // Categorize matches
                                            if (parsedMatch.isLive) {
                                                matches.live.push(parsedMatch);
                                            } else if (matchInfo.state === 'Complete') {
                                                matches.recent.push(parsedMatch);
                                            } else {
                                                matches.upcoming.push(parsedMatch);
                                            }
                                        }
                                    });
                                }
                            }
                        });
                    }
                });

                debugLog(`✅ Parsed: ${matches.live.length} live, ${matches.recent.length} recent, ${matches.upcoming.length} upcoming`, 'success');

            } catch (parseError) {
                debugLog(`❌ Parse Error: ${parseError.message}`, 'error');
                console.error('Detailed Parse Error:', parseError);
            }

            return matches;
        }

        // Update API status indicator
        function updateApiStatus(status, message) {
            const statusEl = document.getElementById('apiStatus');
            statusEl.textContent = message;
            statusEl.className = `api-status ${status}`;
        }

        // Show error message to user
        function showErrorMessage(errorMsg) {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = `
                <div class="error-message">
                    <h3>⚠️ API Connection Failed</h3>
                    <p>${errorMsg}</p>
                    <div class="error-details">
                        <strong>Troubleshooting Steps:</strong><br><br>
                        1. Check if your RapidAPI key is correctly added in the code<br>
                        2. Verify your RapidAPI subscription is active<br>
                        3. Check browser console (F12) for detailed errors<br>
                        4. Ensure you're subscribed to "Cricbuzz Cricket" API on RapidAPI<br>
                        5. Check if you've exceeded your API rate limit
                    </div>
                    <button class="refresh-btn" onclick="loadMatches()">🔄 Retry Connection</button>
                    <button class="refresh-btn" onclick="toggleDebugConsole()">🔍 Show Debug Logs</button>
                </div>
            `;
        }

        function toggleDebugConsole() {
            const debugConsole = document.getElementById('debugConsole');
            debugConsole.style.display = debugConsole.style.display === 'none' ? 'block' : 'none';
        }

        // Display matches
        function displayMatches(matches) {
            const container = document.getElementById('matchesContainer');
            
            if (!matches || matches.length === 0) {
                container.innerHTML = `
                    <div class="error-message">
                        <h3>📭 No ${currentMode} matches found</h3>
                        <p>There are currently no ${currentMode} matches available.</p>
                        <button class="refresh-btn" onclick="loadMatches()">🔄 Refresh</button>
                    </div>
                `;
                debugLog(`No ${currentMode} matches to display`, 'info');
                return;
            }

            debugLog(`Displaying ${matches.length} ${currentMode} matches`, 'success');

            const matchesHTML = matches.map(match => {
                const liveClass = match.isLive ? 'live' : '';
                const liveIndicator = match.isLive ? '<span class="live-indicator"></span>' : '';
                
                return `
                    <div class="match-card">
                        <div class="match-header">
                            <div class="match-title">${match.name}</div>
                            <div class="match-type">${match.matchType}</div>
                        </div>
                        
                        <div class="teams-section">
                            <div class="team">
                                <div class="team-name">${match.team1}</div>
                                <div class="team-score">${match.team1Score}</div>
                            </div>
                            <div class="vs-divider">VS</div>
                            <div class="team">
                                <div class="team-name">${match.team2}</div>
                                <div class="team-score">${match.team2Score}</div>
                            </div>
                        </div>
                        
                        <div class="status-section ${liveClass}">
                            ${liveIndicator}${match.status}
                        </div>
                        
                        <div class="match-details">
                            <div class="detail-row">
                                <span class="detail-label">Venue:</span>
                                <span class="detail-value">${match.venue}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Match ID:</span>
                                <span class="detail-value">#${match.id}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = `<div class="matches-grid">${matchesHTML}</div>`;
        }

        // Mode switching functions
        function showLive() {
            currentMode = 'live';
            updateActiveButton('liveBtn');
            displayMatches(allMatches.live);
        }

        function showRecent() {
            currentMode = 'recent';
            updateActiveButton('recentBtn');
            displayMatches(allMatches.recent);
        }

        function showUpcoming() {
            currentMode = 'upcoming';
            updateActiveButton('upcomingBtn');
            displayMatches(allMatches.upcoming);
        }

        function updateActiveButton(activeId) {
            document.querySelectorAll('.toggle-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(activeId).classList.add('active');
        }

        // Load matches
        async function loadMatches() {
            debugLog('🚀 Loading matches...', 'info');
            const container = document.getElementById('matchesContainer');
            container.innerHTML = '<div class="loading">Fetching cricket matches from API</div>';
            
            updateApiStatus('loading', '⏳ Loading...');
            
            allMatches = await fetchRealMatches();
            displayMatches(allMatches[currentMode]);
        }

        // Initialize app
        window.addEventListener('load', function() {
            debugLog('🏏 Cricket App Initialized!', 'success');
            debugLog(`API Key configured: ${RAPIDAPI_KEY !== 'YOUR_RAPIDAPI_KEY_HERE' ? 'Yes' : 'No'}`, 'info');
            
            loadMatches();
            
            // Auto-refresh every 60 seconds for live matches
            setInterval(() => {
                if (currentMode === 'live') {
                    debugLog('🔄 Auto-refreshing live matches...', 'info');
                    loadMatches();
                }
            }, 60000);
        });
    </script>
</body>
</html>
